# === Zeitungszusteller Platform — lokalna orkiestracja ===
services:
  # --- BAZA DANYCH (PostGIS — wspólna dla GIS i Spring Boot) ---
  postgres:
    image: postgis/postgis:16-3.4
    container_name: global-postgis
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: app_database
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dev_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-network]

  # --- BACKEND: Spring Boot ---
  backend-spring:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    container_name: spring-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app_database
      SPRING_DATASOURCE_USERNAME: dev_user
      SPRING_DATASOURCE_PASSWORD: dev_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [app-network]

  # --- AI PIPELINE: Python 3.12 + LangGraph ---
  ai-pipeline:
    build:
      context: ./ai-pipeline
      dockerfile: Dockerfile
    container_name: python-langgraph
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks: [app-network]

  # --- MAPY: lokalny serwer kafelków (opcjonalne — profile maps) ---
  openfreemap:
    image: maptiler/tileserver-gl:latest
    container_name: openfreemap-server
    ports:
      - "8085:80"
    volumes:
      - ./maps:/data
    command: ["-c", "/data/config.json"]
    profiles: ["maps"]
    networks: [app-network]

  # --- FRONTEND DEV: React + Vite (tryb dev, hot reload) ---
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile.dev
    container_name: react-vite-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-web:/app
      - node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      backend-spring:
        condition: service_healthy
    networks: [app-network]

  # --- AUTOMATYZACJA: Jenkins (DinD) ---
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-ci
    user: root
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/var/jenkins_home/workspace/zeitung-zusteller:ro
    networks: [app-network]

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  jenkins_data:
  node_modules:
