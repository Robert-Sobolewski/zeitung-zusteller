# Test configuration — REPLACES src/main/resources/application.yml (no merging).
# DataSource comes from the @ServiceConnection container bean in each test class.
spring:
  jpa:
    hibernate:
      ddl-auto: none            # schema is loaded from db/init/*.sql, not generated by Hibernate
  sql:
    init:
      mode: always
      schema-locations:         # copied to classpath:db-init/ via pom.xml <testResources>
        - classpath:db-init/01-postgis.sql
        - classpath:db-init/02-schema.sql

logging:
  level:
    org.hibernate.SQL: debug    # see the generated SQL in test output (learning aid)
